name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── 1. Build macOS Release ──────────────────────────────────────────────────
  build-macos:
    name: Build macOS DMG
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer || true

      - name: Build Release Bundle
        run: ./build.sh

      - name: Package DMG
        run: |
          ./scripts/create_dmg.sh build/OpenRouterTracker.app build/OpenRouterTracker.dmg "OpenRouter Tracker"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-dmg
          path: build/OpenRouterTracker.dmg

  # ── 2. Build Windows Release ────────────────────────────────────────────────
  build-windows:
    name: Build Windows Executable & Archive
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt pyinstaller pillow altgraph

      - name: Run Windows Unit Tests
        run: |
          python -m unittest windows.tests.test_windows_core -v

      - name: Build Standalone Windows Executable & Zip
        run: |
          python build_windows.py --no-test

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-binaries
          path: |
            dist/OpenRouterTracker.exe
            dist/OpenRouterTracker-windows-x64.zip

  # ── 3. Publish Multi-Platform Release ───────────────────────────────────────
  publish-release:
    name: Publish Multi-Platform GitHub Release
    needs: [build-macos, build-windows]
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-release-dmg
          path: release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-binaries
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/OpenRouterTracker.dmg
            release-assets/OpenRouterTracker.exe
            release-assets/OpenRouterTracker-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Update Homebrew Tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 release-assets/OpenRouterTracker.dmg | awk '{print $1}')
          echo "Updating tap for OpenRouter Tracker v${VERSION} (SHA: ${SHA})..."

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/vyavahareyash/homebrew-tap.git" tap_repo
          cd tap_repo
          mkdir -p Casks

          cat <<EOF > Casks/openrouter-tracker.rb
          cask "openrouter-tracker" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/vyavahareyash/openrouter-tracker/releases/download/v#{version}/OpenRouterTracker.dmg"
            name "OpenRouter Tracker"
            desc "Native macOS desktop widget & companion app for OpenRouter balance and rate limits"
            homepage "https://github.com/vyavahareyash/openrouter-tracker"

            depends_on macos: :sonoma

            app "OpenRouterTracker.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-cr", "#{appdir}/OpenRouterTracker.app"]
              system_command "/usr/bin/pluginkit",
                             args: ["-a", "#{appdir}/OpenRouterTracker.app/Contents/PlugIns/OpenRouterWidgetExtension.appex"]
              system_command "/usr/bin/pluginkit",
                             args: ["-e", "use", "-i", "com.openrouter.tracker.widget"]
              system_command "/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister",
                             args: ["-f", "-R", "-trusted", "#{appdir}/OpenRouterTracker.app"]
            end

            zap trash: [
              "~/Library/Application Scripts/group.com.openrouter.tracker",
              "~/Library/Group Containers/group.com.openrouter.tracker",
              "~/Library/Preferences/com.openrouter.tracker.plist",
            ]
          end
          EOF

          # Reformat leading indents to standard 2-spaces
          sed -i '' 's/^          //' Casks/openrouter-tracker.rb || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/openrouter-tracker.rb
          if ! git diff --cached --quiet; then
            git commit -m "bump(openrouter-tracker): v${VERSION}"
            git push origin main
          fi
