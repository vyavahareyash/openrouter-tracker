name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Secret scanning ──────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Build & Test (macOS) ─────────────────────────────────────────────────
  build-and-test-macos:
    name: Build & Test (macOS Sonoma)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer || true

      - name: Run Unit Tests
        run: ./scripts/run_tests.sh

      - name: Generate Xcode Project
        run: python3 generate_project.py

      - name: Build App & Widget Extension
        run: |
          xcodebuild build \
            -project OpenRouterTracker.xcodeproj \
            -scheme OpenRouterTracker \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath ./build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

  # ── 3. Build & Test (Windows) ───────────────────────────────────────────────
  build-and-test-windows:
    name: Build & Test (Windows 10/11)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt pyinstaller pillow altgraph

      - name: Run Windows Unit Tests
        run: |
          python -m unittest windows.tests.test_windows_core -v

      - name: Build Standalone Windows Executable
        run: |
          python build_windows.py --no-test
